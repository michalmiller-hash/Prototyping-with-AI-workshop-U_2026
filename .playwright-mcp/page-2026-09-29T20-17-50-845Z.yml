                - paragraph [ref=f2e178]: Co zmienię, porównam albo sprawdzę?
            - paragraph [ref=f2e179]: "Informacja zwrotna i zaskoczenie są ważne: gotowy szkic lub prototyp pokazuje konsekwencje, których nie dało się w pełni przewidzieć przed rozpoczęciem pracy."
            - paragraph [ref=f2e180]: W Tetrisie obrót lub przesunięcie klocka może wyglądać jak zbędny ruch, ale pomaga zobaczyć, gdzie klocek pasuje. W projektowaniu też czasem zmieniamy artefakt po to, by łatwiej pomyśleć.
          - region [ref=f2e181]:
            - generic [ref=f2e182]:
              - heading "AI ma wspierać Twój kolejny ruch" [level=3] [ref=f2e183]
              - paragraph [ref=f2e184]: "AI może ograniczyć wysiłek wykonawczy, ale zachowaj wysiłek epistemiczny: odkrywaj, rozumiej, porównuj i przeformułowuj problem. Jeśli tylko prosisz o gotową odpowiedź i ją oceniasz, łatwo stajesz się recenzentem zamiast współtwórcą."
