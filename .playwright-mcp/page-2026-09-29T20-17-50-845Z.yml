              - heading "Kluczowa myśl" [level=3] [ref=f2e142]
              - paragraph [ref=f2e143]: Thinking Through Making zakłada, że część wiedzy powstaje w trakcie pracy. Tworząc i oglądając możliwe rozwiązanie, możemy zauważyć coś, czego nie było widać, gdy pomysł pozostawał w głowie.
              - paragraph [ref=f2e144]: "W projektowaniu materiałem może być szkic, tekst, diagram, kod lub prototyp. Donald Schön opisywał projektowanie jako „reflective conversation with materials”: działamy na materiale, obserwujemy jego odpowiedź i w ten sposób lepiej rozumiemy problem."
            - blockquote [ref=f2e145]:
              - paragraph [ref=f2e146]: „Reflective conversation with materials”
              - generic [ref=f2e147]: "Donald Schön: projektant działa na materiale, obserwuje jego odpowiedź i na tej podstawie zmienia dalsze działanie."
          - region [ref=f2e148]:
            - heading "Myślenie i tworzenie tworzą pętlę" [level=3] [ref=f2e149]
            - list [ref=f2e150]:
              - listitem [ref=f2e151]:
