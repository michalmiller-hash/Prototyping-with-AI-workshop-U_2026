              - paragraph [ref=e183]: AI może ograniczyć żmudne wykonanie, ale nie powinno odbierać Ci działań, dzięki którym odkrywasz i rozumiesz problem. Jeśli tylko prosisz o gotową odpowiedź i ją oceniasz, łatwo stajesz się recenzentem zamiast współtwórcą. Zmieniaj wynik, porównuj kierunki i wybieraj następny ruch.
