            - paragraph [ref=e179]: W Tetrisie obrót klocka może nie przybliżać bezpośrednio do wyniku, ale pomaga zobaczyć, gdzie klocek pasuje. W projektowaniu też czasem działamy po to, by lepiej dostrzec możliwości.
          - region [ref=e180]:
