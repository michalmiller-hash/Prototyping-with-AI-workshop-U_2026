              - heading "Kluczowa myśl" [level=3] [ref=e142]
              - paragraph [ref=e143]: Thinking Through Making zakłada, że część wiedzy powstaje w trakcie pracy. Kiedy tworzysz i oglądasz możliwe rozwiązanie, możesz zauważyć coś, czego nie było widać, gdy pomysł pozostawał w głowie.
              - paragraph [ref=e144]: W projektowaniu materiałem może być szkic, tekst, diagram lub prototyp. Donald Schön opisywał projektowanie jako „reflective conversation with materials” — rozmowę, w której działanie zmienia materiał, a jego odpowiedź zmienia nasze rozumienie.
            - blockquote [ref=e145]:
              - paragraph [ref=e146]: „Reflective conversation with materials”
              - generic [ref=e147]: "Donald Schön: projektant działa na materiale, obserwuje jego odpowiedź i na tej podstawie zmienia dalsze działanie."
