              - paragraph [ref=f1e58]: "AI może ograniczyć wysiłek wykonawczy, ale zachowaj wysiłek poznawczy: odkrywaj, rozumiej, porównuj i przeformułowuj problem. Jeśli tylko prosisz o gotową odpowiedź i ją oceniasz, łatwo stajesz się recenzentem zamiast współtwórcą."
