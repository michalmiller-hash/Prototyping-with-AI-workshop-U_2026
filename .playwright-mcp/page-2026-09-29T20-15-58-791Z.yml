            - paragraph [ref=f1e228]: AI może stworzyć dopracowany ekran, zanim dobrze rozumiesz problem. Dojrzałość reprezentacji nie oznacza dojrzałości myślenia; wygląd prototypu nie dowodzi, że rozwiązanie odpowiada na potrzebę użytkownika.
            - paragraph [ref=f1e229]: W badaniu pracowników umysłowych większa wiara w możliwości AI wiązała się z mniejszym deklarowanym zaangażowaniem w krytyczne myślenie. To korelacja, nie dowód przyczynowości.
            - paragraph [ref=f1e230]: Największe ryzyko pojawia się, gdy AI wykonuje rozwiązanie, zanim poznasz różne kierunki. Najpierw wnieś własny pomysł, potem używaj AI do kolejnych ruchów i samodzielnie wybieraj, co sprawdzić dalej.
