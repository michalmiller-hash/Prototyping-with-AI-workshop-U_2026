            - paragraph [ref=f1e54]: W Tetrisie obrót lub przesunięcie klocka może wyglądać jak zbędny ruch, ale pomaga zobaczyć, gdzie klocek pasuje. W projektowaniu też czasem zmieniamy artefakt po to, by łatwiej pomyśleć.
