              - heading "Kluczowa myśl" [level=3] [ref=f1e17]
              - paragraph [ref=f1e18]: Thinking Through Making zakłada, że część wiedzy powstaje w trakcie pracy. Tworząc i oglądając możliwe rozwiązanie, możemy zauważyć coś, czego nie było widać, gdy pomysł pozostawał w głowie.
              - paragraph [ref=f1e19]: "W projektowaniu materiałem może być szkic, tekst, diagram, kod lub prototyp. Donald Schön opisywał projektowanie jako „reflective conversation with materials”: działamy na materiale, obserwujemy jego odpowiedź i w ten sposób lepiej rozumiemy problem."
            - blockquote [ref=f1e20]:
              - paragraph [ref=f1e21]: „Reflective conversation with materials”
              - generic [ref=f1e22]: "Donald Schön: projektant działa na materiale, obserwuje jego odpowiedź i na tej podstawie zmienia dalsze działanie."
          - region [ref=f1e23]:
            - heading "Myślenie i tworzenie tworzą pętlę" [level=3] [ref=f1e24]
            - list [ref=f1e25]:
              - listitem [ref=f1e26]:
